# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

set: [pipefail]
shopt: [globstar]

vars:
  GITHUB_REPOSITORY: rust-vmm/vhost-device
  LATEST_VERSION:
    sh: coreutils test -f version.json && jq -r '.version' version.json || echo 'unknown'
  BUILD_TARGET: '{{env "BUILD_TARGET" | default "x86_64-linux-gnu"}}'
  RUST_TARGET: '{{.BUILD_TARGET | replace "-linux-" "-unknown-linux-"}}'
  GLIBC_VERSION: '2.25'
  MATRIX_TARGETS:
  - aarch64-linux-gnu
  - x86_64-linux-gnu
  # Crates without native library dependencies
  CRATES:
  - vhost-device-can
  - vhost-device-console
  - vhost-device-i2c
  - vhost-device-input
  - vhost-device-rng
  - vhost-device-rtc
  - vhost-device-scmi
  - vhost-device-scsi
  - vhost-device-spi
  - vhost-device-vsock
  # Crates whose man pages are generated by xtask
  MANGEN_CRATES:
  - vhost-device-rtc
  - vhost-device-scmi
  - vhost-device-scsi

includes:
  tool:
    taskfile: tool.task.yml
    internal: true

tasks:
  default:
    desc: '{{.TASK}}'
    silent: true
    cmds:
    - task: sha256sum:verify

  matrix:
    desc: '{{.TASK}}'
    silent: true
    deps:
    - task: tool:aqua:tag:jq
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
    cmds:
    - >-
      echo '{{ .MATRIX_TARGETS | toJson }}'
      | jq -cM '{include: map({version: "{{.VERSION}}", target: .})}'

  version:
    desc: '{{.TASK}}'
    silent: true
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
    cmds:
    - echo '{{.VERSION}}'

  tag:
    desc: '{{.TASK}}'
    silent: true
    deps:
    - task: tool:aqua:tag:gh
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
      VALID: '{{regexMatch "^[0-9a-f]{40}$" .VERSION}}'
    preconditions:
    - sh: coreutils test '{{.VALID}}' = 'true'
      msg: 'unexpected vhost-device commit: {{.VERSION}}'
    cmds:
    # committed on 2026-10-08 -> v2026.10.8
    - >-
      gh api 'repos/{{.GITHUB_REPOSITORY}}/commits/{{.VERSION}}'
      --jq '.commit.committer.date[0:10] | split("-") | map(tonumber) | "v\(.[0]).\(.[1]).\(.[2])"'

  name:
    desc: '{{.TASK}}'
    silent: true
    cmds:
    - echo 'vhost-device-{{.BUILD_TARGET}}'

  binname:
    desc: '{{.TASK}}'
    silent: true
    vars:
      NAME:
        sh: task build:name
    cmds:
    - echo '{{.NAME}}.tar.gz'

  binpath:
    desc: '{{.TASK}}'
    silent: true
    vars:
      VERSION:
        sh: task build:version
      BINNAME:
        sh: task build:binname
    cmds:
    - echo '{{.ROOT_DIR}}/.build/{{.VERSION}}/dist/{{.BINNAME}}'

  toolchain:
    desc: '{{.TASK}}'
    run: once
    dir: '{{.ROOT_DIR}}'
    sources:
    - '{{.ROOT_DIR}}/rust-toolchain.toml'
    cmds:
    - rustup toolchain install

  download:
    desc: '{{.TASK}}'
    run: once
    dir: '{{.ROOT_DIR}}'
    deps:
    - task: tool:aqua:tag:jq
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
    status:
    - coreutils test -f '{{.ROOT_DIR}}/.build/vhost-device-{{.VERSION}}.tar.gz'
    cmds:
    - cmd: coreutils mkdir -p '{{.ROOT_DIR}}/.build'
      silent: true
    # TODO: which curl command
    - >-
      curl -fsSLo '{{.ROOT_DIR}}/.build/vhost-device-{{.VERSION}}.tar.gz'
      "https://github.com/{{.GITHUB_REPOSITORY}}/archive/{{.VERSION}}.tar.gz"

  extract:
    desc: '{{.TASK}}'
    run: once
    dir: '{{.ROOT_DIR}}'
    deps:
    - task: tool:aqua:tag:coreutils
    - task: download
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
    sources:
    - '{{.ROOT_DIR}}/.build/vhost-device-{{.VERSION}}.tar.gz'
    generates:
    - '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src/Cargo.toml'
    cmds:
    - cmd: coreutils mkdir -p '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src'
      silent: true
    # TODO: which tar command
    - >-
      tar -xf '{{.ROOT_DIR}}/.build/vhost-device-{{.VERSION}}.tar.gz'
      -C '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src'
      --strip-components 1

  binary:
    desc: '{{.TASK}}'
    dir: '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src'
    deps:
    - task: tool:aqua:tag:zig
    - task: toolchain
    - task: extract
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
    env:
      CARGO_PROFILE_RELEASE_STRIP: 'true'
    sources:
    - '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src/Cargo.toml'
    - '{{.ROOT_DIR}}/rust-toolchain.toml'
    generates:
    - '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src/target/{{.RUST_TARGET}}/release/vhost-device-vsock'
    cmds:
    - >-
      cargo zigbuild --release --locked
      --target '{{.RUST_TARGET}}.{{.GLIBC_VERSION}}'
      {{range .CRATES}}-p {{.}} {{end}}

  mangen:
    desc: '{{.TASK}}'
    dir: '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src'
    deps:
    - task: toolchain
    - task: extract
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
    sources:
    - '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src/Cargo.toml'
    - '{{.ROOT_DIR}}/rust-toolchain.toml'
    generates:
    - '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src/target/dist/man/*.1'
    cmds:
    - >-
      cargo run --release --locked -p xtask --no-default-features
      --features 'mangen,{{.MANGEN_CRATES | join ","}}'
      -- mangen

  install:
    desc: '{{.TASK}}'
    dir: '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src'
    deps:
    - task: tool:aqua:tag:coreutils
    - task: binary
    - task: mangen
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
      PREFIX: '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/pkg/usr/local'
    sources:
    - '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src/target/{{.RUST_TARGET}}/release/vhost-device-*'
    - '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/src/target/dist/man/*.1'
    generates:
    - '{{.PREFIX}}/bin/vhost-device-vsock'
    cmds:
    - cmd: coreutils rm -rf '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/pkg'
      silent: true
    - for: {var: CRATES}
      cmd: >-
        coreutils install -Dm755
        'target/{{.RUST_TARGET}}/release/{{.ITEM}}'
        '{{.PREFIX}}/bin/{{.ITEM}}'
    - for: {var: CRATES}
      cmd: >-
        coreutils install -Dm644 '{{.ITEM}}/README.md'
        '{{.PREFIX}}/share/doc/{{.ITEM}}/README.md'
    - >-
      coreutils install -Dm644 -t '{{.PREFIX}}/share/doc/vhost-device'
      README.md LICENSE-APACHE LICENSE-BSD-3-Clause
    - >-
      coreutils install -Dm644 -t '{{.PREFIX}}/share/man/man1'
      target/dist/man/*.1 vhost-device-vsock/vhost-device-vsock.1

  prepare:
    desc: '{{.TASK}}'
    dir: '{{.ROOT_DIR}}/.build/{{.VERSION}}/{{.BUILD_TARGET}}/pkg/usr/local'
    deps:
    - task: tool:aqua:tag:coreutils
    - task: install
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
      DIST_BINNAME: 'vhost-device-{{.BUILD_TARGET}}.tar.gz'
    sources:
    - '**/*'
    generates:
    - '{{.ROOT_DIR}}/.build/{{.VERSION}}/dist/{{.DIST_BINNAME}}'
    cmds:
    - cmd: coreutils mkdir -p '{{.ROOT_DIR}}/.build/{{.VERSION}}/dist'
      silent: true
    # TODO: which tar command
    - >-
      tar --sort=name --owner=0 --group=0 --numeric-owner
      --mode='u+rwX,go+rX,go-w'
      --mtime='@0'
      -cf - bin share
      | gzip -9n > '{{.ROOT_DIR}}/.build/{{.VERSION}}/dist/{{.DIST_BINNAME}}'

  sha256sum:
    desc: '{{.TASK}}'
    dir: '{{.ROOT_DIR}}/.build/{{.VERSION}}/dist'
    deps:
    - task: tool:aqua:tag:coreutils
    - task: prepare
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
      BINNAME: 'vhost-device-{{.BUILD_TARGET}}.tar.gz'
    sources:
    - '{{.BINNAME}}'
    generates:
    - '{{.BINNAME}}.sha256sum'
    cmds:
    - coreutils sha256sum -b "{{.BINNAME}}" | coreutils tee "{{.BINNAME}}.sha256sum"

  sha256sum:verify:
    desc: '{{.TASK}}'
    dir: '{{.ROOT_DIR}}/.build/{{.VERSION}}/dist'
    deps:
    - task: tool:aqua:tag:coreutils
    - task: sha256sum
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
      BINNAME: 'vhost-device-{{.BUILD_TARGET}}.tar.gz'
    sources:
    - '{{.BINNAME}}'
    generates:
    - '{{.ROOT_DIR}}/.build/{{.VERSION}}/.done_sha256sum_verify_{{.BUILD_TARGET}}'
    cmds:
    - coreutils sha256sum -c "{{.BINNAME}}.sha256sum"
    - cmd: touch '{{.ROOT_DIR}}/.build/{{.VERSION}}/.done_sha256sum_verify_{{.BUILD_TARGET}}'
      silent: true

  cosign:
    desc: '{{.TASK}}'
    dir: '{{.ROOT_DIR}}/.build/{{.VERSION}}/dist'
    deps:
    - task: prepare
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
      BINNAME: 'vhost-device-{{.BUILD_TARGET}}.tar.gz'
    sources:
    - '{{.BINNAME}}'
    generates:
    - '{{.BINNAME}}.sigstore.json'
    cmds:
    - >-
      cosign sign-blob {{.BINNAME}}
      -y
      --bundle {{.BINNAME}}.sigstore.json

  cosign:verify:
    desc: '{{.TASK}}'
    dir: '{{.ROOT_DIR}}/.build/{{.VERSION}}/dist'
    deps:
    - task: cosign
    vars:
      VERSION: '{{env "BUILD_VERSION" | default .LATEST_VERSION}}'
      BINNAME: 'vhost-device-{{.BUILD_TARGET}}.tar.gz'
    requires:
      vars:
      - CERTIFICATE_IDENTITY
      - CERTIFICATE_OIDC_ISSUER
    sources:
    - '{{.BINNAME}}'
    - '{{.BINNAME}}.sigstore.json'
    generates:
    - '{{.ROOT_DIR}}/.build/{{.VERSION}}/.done_cosign_verify'
    cmds:
    - >-
      cosign verify-blob '{{.BINNAME}}'
      --bundle '{{.BINNAME}}.sigstore.json'
      --certificate-identity '{{.CERTIFICATE_IDENTITY}}'
      --certificate-oidc-issuer '{{.CERTIFICATE_OIDC_ISSUER}}'
    - cmd: touch '{{.ROOT_DIR}}/.build/{{.VERSION}}/.done_cosign_verify'
      silent: true
